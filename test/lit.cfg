# -*- Python -*-

import os
import platform
import re
import subprocess
import tempfile

import lit.formats
import lit.util

from lit.llvm import llvm_config# Configuration file for the 'lit' test runner.

# name: The name of this test suite.
config.name = 'Templight'

# suffixes: A list of file extensions to treat as test files.
config.suffixes = ['.c', '.cpp', '.cppm', '.m', '.mm', '.cu',
                   '.ll', '.cl', '.s', '.S', '.modulemap', '.test', '.rs']

# excludes: A list of directories to exclude from the testsuite. The 'Inputs'
# subdirectories contain auxiliary inputs for various tests in their parent
# directories.
config.excludes = ['Inputs', 'CMakeLists.txt']

# test_source_root: The root path where tests are located.
config.test_source_root = os.path.dirname(__file__)

config.test_format = lit.formats.ShTest()

# test_exec_root: The root path where tests should be run.
config.test_exec_root = os.path.join(config.templight_obj_root, 'test')

llvm_config.use_default_substitutions()

llvm_config.use_clang()

config.substitutions.append(('%PATH%', config.environment['PATH']))

config.substitutions.append(('%templight_cc1', 'templight -cc1'))

# The plugin whose pragma ends a compilation in SIGILL, where it is built.
illegal_instruction_plugin = os.path.join(
    config.llvm_shlib_dir, 'TemplightIllegalInstruction' + config.llvm_plugin_ext)
if os.path.exists(illegal_instruction_plugin):
    config.available_features.add('illegal-instruction-plugin')
config.substitutions.append(
    ('%illegal_instruction_plugin', illegal_instruction_plugin))
